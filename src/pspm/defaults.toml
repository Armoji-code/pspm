# PSPM defaults. Override any key in the user config file
# (path printed by `pspm config`), e.g. to add a folder or disable a feature.

[app]
theme = "dark"            # dark | light (see [themes.*])
poll_seconds = 2          # how often to look for a plugged-in PSP
open_on_connect = true    # `pspm watch` opens the app when a PSP appears

# Features shown in the sidebar, in order. Third-party features register
# under the "pspm.features" entry point and are enabled by adding their id here.
features = ["files", "diag", "tagger", "saves", "backup", "ps1", "stream", "softmod", "themes"]

[device]
# A mounted drive counts as a PSP when this folder exists at its root.
marker = "PSP"

# File manager categories: label -> folder on the memory stick.
[device.folders]
games = "PSP/GAME"
isos = "ISO"
plugins = "SEPLUGINS"
themes = "PSP/THEME"
saves = "PSP/SAVEDATA"
music = "MUSIC"
photos = "PICTURE"
video = "VIDEO"

# MP3 tagger. Lookups use MusicBrainz + Cover Art Archive: free, no account or key.
[tagger]
musicbrainz_url = "https://musicbrainz.org/ws/2"
coverart_url = "https://coverartarchive.org"
user_agent = "PSPM/0.1 (https://github.com/Armoji-code/pspm)"  # MusicBrainz requires an identifying agent
request_gap_seconds = 1.0  # MusicBrainz allows 1 request per second
timeout_seconds = 15
min_score = 90             # 0-100 MusicBrainz match score; lower finds more but guesses more
cover_size = 500           # px, longest side; covers are saved as baseline JPEG for the PSP
sort_by = "album"          # album | artist | genre

# PPSSPP save sync. Runs both ways each time the PSP is plugged in; overwritten saves are backed up.
[saves]
auto_sync = true          # sync on plug-in when nothing conflicts; conflicts always wait for you

# PPSSPP's memory stick PSP folder, per OS; the first that exists is used. {documents} = your Documents folder.
# Portable or custom installs: pick the folder in the app, or add it here.
[saves.ppsspp_paths]
windows = ["{documents}/PPSSPP/PSP"]
linux = ["~/.config/ppsspp/PSP", "~/.var/app/org.ppsspp.PPSSPP/config/ppsspp/PSP"]

# Cloud backup. Mirrors the folders below to a cloud folder on plug-in, uploading only changed files, and RESTORE
# downloads that folder back to the stick. Nothing is deleted in the cloud. Sign-in happens in your browser; the token
# is kept in the OS keyring.
[backup]
provider = "gdrive"       # gdrive | dropbox | any provider registered under the "pspm.cloud" entry point
auto = true               # back up on plug-in once signed in
folders = ["saves"]       # labels from [device.folders], e.g. ["saves", "music", "photos"]
remote_folder = "PSPM"    # cloud folder, changeable in the app; "Backups/PSP" makes nested folders
redirect_port = 0         # browser sign-in returns to http://127.0.0.1:<port>/; 0 = any free port (Dropbox needs a fixed one)
login_timeout_seconds = 300

# PSPM's own Google OAuth client (type "Desktop app", scope drive.file), so signing in is one button. Google treats a
# desktop app's secret as not confidential. To use your own client instead, set both in your config.toml.
[backup.gdrive]
client_id = ""
client_secret = ""
auth_url = "https://accounts.google.com/o/oauth2/v2/auth"
token_url = "https://oauth2.googleapis.com/token"
api_url = "https://www.googleapis.com/drive/v3"
upload_url = "https://www.googleapis.com/upload/drive/v3"

# Dropbox needs an app of your own (see README); put its key in your config.toml.
[backup.dropbox]
client_id = ""            # the Dropbox app key (PKCE, no secret needed)
redirect_port = 53682     # register http://127.0.0.1:53682/ in your app
auth_url = "https://www.dropbox.com/oauth2/authorize"
token_url = "https://api.dropboxapi.com/oauth2/token"
api_url = "https://api.dropboxapi.com/2"
content_url = "https://content.dropboxapi.com/2"
chunk_mb = 64             # files bigger than this upload in parts (Dropbox caps one request at 150 MB)

# Diagnostics. Battery, firmware and model can't be read over USB: the PSPM Info app (installed from the
# DIAGNOSTICS page, needs custom firmware) writes them to info_file when run on the PSP.
[diag]
info_app_folder = "PSP/GAME/PSPM_INFO"
info_file = "PSP/COMMON/pspm_info.txt"
test_folder = "PSPM_TEST"  # capacity test data, removed after VERIFY
test_file_mb = 1024        # size of each test file (FAT32 caps files at 4 GB)
test_reserve_mb = 16       # free space left untouched by the capacity test

# PS1 converter. Turns PS1 disc images into an EBOOT.PBP in the games folder, for the PSP's PS1 emulator.
# Uses PSXPackager (MIT, github.com/RupertAvery/PSXPackager), downloaded on first use and checked by sha256.
# Its download includes the converter's own base files; PSPM ships none of them. Needs custom firmware on the PSP.
[ps1]
version = "1.6.3"
compression = 5            # 0-9; higher is smaller and slower to convert
timeout_seconds = 120

[ps1.tool.windows]          # needs the .NET 8 runtime (Windows offers to install it on first run)
url = "https://github.com/RupertAvery/PSXPackager/releases/download/v1.6.3/psxpackager-win-x64.zip"
sha256 = "3aaabe6009461c13bec85cfc441cf30dac6314867297a0bfd9b4b0257c8ced83"
exe = "psxpackager.exe"

[ps1.tool.linux]
url = "https://github.com/RupertAvery/PSXPackager/releases/download/v1.6.3/psxpackager-linux-x64.tar.gz"
sha256 = "378ecb4d2310c8f72fc77ec092e50797427de79d6e001ab0b56eaad4699890da"
exe = "psxpackager-linux-x64/psxpackager"

# Screen streaming, PSP to PC, with RemoteJoyLite (github.com/Kethen/RemoteJoyLite): a plugin on the PSP sends the
# screen over the USB cable to a viewer window on the PC, which also passes your keyboard or gamepad to the PSP.
# Downloaded on first use and checked by sha256. Needs custom firmware. PC to PSP isn't offered: no maintained tool exists.
[stream]
plugin = "SEPLUGINS/RemoteJoyLite.prx"

# Plugin list on the stick -> lines that load the plugin. PLUGINS.TXT is ARK's; the .txt files are PRO/ME's.
# shortcut: paths say ms0:, so a PSP Go streams only with the plugin on its memory stick, not internal storage (ef0:).
[stream.lists]
"SEPLUGINS/PLUGINS.TXT" = ["vsh, ms0:/SEPLUGINS/RemoteJoyLite.prx, on", "game, ms0:/SEPLUGINS/RemoteJoyLite.prx, on",
                           "pops, ms0:/SEPLUGINS/RemoteJoyLite.prx, on"]
"SEPLUGINS/vsh.txt" = ["ms0:/SEPLUGINS/RemoteJoyLite.prx 1"]
"SEPLUGINS/game.txt" = ["ms0:/SEPLUGINS/RemoteJoyLite.prx 1"]
"SEPLUGINS/pops.txt" = ["ms0:/SEPLUGINS/RemoteJoyLite.prx 1"]

[stream.tool]
version = "2026-01-06"
url = "https://github.com/Kethen/RemoteJoyLite/releases/download/2026-01-06/RemoteJoyLite_a0bc706a.zip"
sha256 = "93c6c739e05a5008e753f5b0982f78130bbc863bae9f3668349919ed8ba68768"
prx = "psp/RemoteJoyLite.prx"
udev_rule = "x64_linux/60-psp-b-usb.rules"  # Linux: lets you, not just root, open the PSP's USB
timeout_seconds = 120

# Viewer per OS; {dir} is the unpacked download. Use the _JA_ files for the Japanese viewer. On Linux it runs in Wine.
[stream.run]
windows = ["{dir}/x64/RemoteJoyLite_EN_64.exe"]
linux = ["bash", "{dir}/x64_linux/start_linux_EN.sh"]

# Softmod: copies the official ARK custom firmware release to the memory stick, downloaded and checked by sha256.
# PSPM never writes the PSP's flash. You install ARK on the PSP by running the copied app; until you also install a
# cIPL there, ARK is gone after a full power-off and you run the app again. The cIPL installer is only copied when
# you tick it in the app, and it is what writes the PSP's flash when you run it there.
# ARK supports every retail PSP (1000, 2000, 3000, Go, Street E1000) on official firmware 6.60 or 6.61.
[softmod]
default = "ark5"             # ark5 | ark4
firmware = ["6.60", "6.61"]  # blocks the copy when the PSPM Info app reports anything else
min_battery = 75             # %, asked before copying, and blocks when PSPM Info last saw less without the charger
timeout_seconds = 120

# ARK-5 through FasterARK (github.com/PSP-Arkfive/FasterARK), lite variant. Upstream re-uses the "latest" tag for
# each release, so a new release changes the file and the sha256 check refuses it until url/sha256 are updated here.
[softmod.ark5]
name = "ARK-5"
version = "5.1.0"
url = "https://github.com/PSP-Arkfive/FasterARK/releases/download/latest/FasterARK_psp_lite.zip"
sha256 = "16d922916beaaa4b20d7c695c1f4d0bdfa3e43f5e273fd2852c1e29d3e4081dd"
run = "FASTERARK"
cipl_run = "CUSTOMIPL"
[softmod.ark5.copy]          # folder in the download -> folder on the stick
"PSP/GAME/FasterARK" = "PSP/GAME/FasterARK"
"PSP/SAVEDATA/ARK_01234" = "PSP/SAVEDATA/ARK_01234"
[softmod.ark5.cipl]          # permanent install, opt-in
"PSP/GAME/CustomIPL" = "PSP/GAME/CustomIPL"

# ARK-4 final release (github.com/PSP-Archive/ARK-4, archived 2026-08-02). It can update itself to ARK-5 later.
[softmod.ark4]
name = "ARK-4"
version = "4.20.69-r206"
url = "https://github.com/PSP-Archive/ARK-4/releases/download/v42069r206/ARK4.zip"
sha256 = "d38f3dda6f18b783bdb05a9c1bf6ed46bf4cbd7963a66db4eca9f6b2fd32c483"
run = "ARK LOADER"
cipl_run = "ARK_CIPL"
[softmod.ark4.copy]
"ARK_01234" = "PSP/SAVEDATA/ARK_01234"
"ARK_Loader" = "PSP/GAME/ARK_Loader"
[softmod.ark4.cipl]          # permanent install, opt-in
"PSP/ARK_cIPL" = "PSP/GAME/ARK_cIPL"

# Theme maker. Builds PTF themes (any PSP on firmware 6.20 or later) and CTF themes (custom firmware with the CXMB plugin,
# which PSPM doesn't install). CXMB only loads a CTF marked for the PSP's firmware: 0xDEAD0660 or 0xDEAD0661 for 6.60/6.61.
# A CTF opened as a template keeps its own mark, since its flash0 files only fit the firmware it was made for.
[theme_maker]
ctf_magic = 0xDEAD0661

[themes.dark]
bg = "#000000"
surface = "#111111"
border = "#333333"
text = "#E8E8E8"
text_secondary = "#999999"
text_disabled = "#666666"
display = "#FFFFFF"
accent = "#D71921"
success = "#4A9E5C"

[themes.light]
bg = "#F5F5F5"
surface = "#FFFFFF"
border = "#CCCCCC"
text = "#1A1A1A"
text_secondary = "#666666"
text_disabled = "#999999"
display = "#000000"
accent = "#D71921"
success = "#4A9E5C"
