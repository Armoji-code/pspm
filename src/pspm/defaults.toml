# PSPM defaults. Override any key in the user config file
# (path printed by `pspm config`), e.g. to add a folder or disable a feature.

[app]
theme = "dark"            # dark | light (see [themes.*])
poll_seconds = 2          # how often to look for a plugged-in PSP
open_on_connect = true    # `pspm watch` opens the app when a PSP appears

# Features shown in the sidebar, in order. Third-party features register
# under the "pspm.features" entry point and are enabled by adding their id here.
features = ["files", "tagger", "saves"]

[device]
# A mounted drive counts as a PSP when this folder exists at its root.
marker = "PSP"

# File manager categories: label -> folder on the memory stick.
[device.folders]
games = "PSP/GAME"
isos = "ISO"
plugins = "SEPLUGINS"
themes = "PSP/THEME"
saves = "PSP/SAVEDATA"
music = "MUSIC"
photos = "PICTURE"
video = "VIDEO"

# MP3 tagger. Lookups use MusicBrainz + Cover Art Archive: free, no account or key.
[tagger]
musicbrainz_url = "https://musicbrainz.org/ws/2"
coverart_url = "https://coverartarchive.org"
user_agent = "PSPM/0.1 (https://github.com/Armoji-code/pspm)"  # MusicBrainz requires an identifying agent
request_gap_seconds = 1.0  # MusicBrainz allows 1 request per second
timeout_seconds = 15
min_score = 90             # 0-100 MusicBrainz match score; lower finds more but guesses more
cover_size = 500           # px, longest side; covers are saved as baseline JPEG for the PSP
sort_by = "album"          # album | artist | genre

# PPSSPP save sync. Runs both ways each time the PSP is plugged in; overwritten saves are backed up.
[saves]
auto_sync = true          # sync on plug-in when nothing conflicts; conflicts always wait for you

# PPSSPP's memory stick PSP folder, per OS; the first that exists is used. {documents} = your Documents folder.
# Portable or custom installs: pick the folder in the app, or add it here.
[saves.ppsspp_paths]
windows = ["{documents}/PPSSPP/PSP"]
linux = ["~/.config/ppsspp/PSP", "~/.var/app/org.ppsspp.PPSSPP/config/ppsspp/PSP"]

[themes.dark]
bg = "#000000"
surface = "#111111"
border = "#333333"
text = "#E8E8E8"
text_secondary = "#999999"
text_disabled = "#666666"
display = "#FFFFFF"
accent = "#D71921"
success = "#4A9E5C"

[themes.light]
bg = "#F5F5F5"
surface = "#FFFFFF"
border = "#CCCCCC"
text = "#1A1A1A"
text_secondary = "#666666"
text_disabled = "#999999"
display = "#000000"
accent = "#D71921"
success = "#4A9E5C"
