# PSPM defaults. Override any key in the user config file
# (path printed by `pspm config`), e.g. to add a folder or disable a feature.

[app]
theme = "dark"            # dark | light (see [themes.*])
poll_seconds = 2          # how often to look for a plugged-in PSP
open_on_connect = true    # `pspm watch` opens the app when a PSP appears

# Features shown in the sidebar, in order. Third-party features register
# under the "pspm.features" entry point and are enabled by adding their id here.
features = ["files", "diag", "tagger", "saves", "backup", "ps1", "stream", "softmod", "themes", "setup"]

[device]
# A mounted drive counts as a PSP when this folder exists at its root.
marker = "PSP"

# File manager categories: label -> folder on the memory stick.
[device.folders]
games = "PSP/GAME"
isos = "ISO"
plugins = "SEPLUGINS"
themes = "PSP/THEME"
saves = "PSP/SAVEDATA"
music = "MUSIC"
photos = "PICTURE"
video = "VIDEO"

# File manager tabs: label -> prefix of the top folders shown as tabs ("" = every folder).
# CAT_ folders are the Game Categories plugin's; anything outside them goes under plain_tab.
[files]
plain_tab = "uncategorized"
[files.tabs]
games = "CAT_"
isos = "CAT_"
music = ""

# Categories that also show other categories' folders, merged into the same tabs (PSP ISOs next to homebrew/minis).
[files.merge]
games = ["isos"]

# File types that belong in a category: a file dropped or added in a merged view goes to the first that lists it.
[files.types]
isos = [".iso", ".cso"]

# MP3 tagger. Lookups use MusicBrainz + Cover Art Archive: free, no account or key.
[tagger]
musicbrainz_url = "https://musicbrainz.org/ws/2"
coverart_url = "https://coverartarchive.org"
itunes_url = "https://itunes.apple.com/search"  # cover fallback when the Cover Art Archive has none (free, no key)
user_agent = "PSPM/0.1 (https://github.com/Armoji-code/pspm)"  # MusicBrainz requires an identifying agent
request_gap_seconds = 1.0  # MusicBrainz allows 1 request per second
retries = 3                # on "busy" (HTTP 503/429), wait (Retry-After, else 1, 2, 4 s) and try again
timeout_seconds = 15
min_score = 90             # 0-100 MusicBrainz match score; lower finds more but guesses more
cover_size = 500           # px, longest side; covers are saved as baseline JPEG for the PSP
sort_by = "album"          # album | artist | genre

# PPSSPP save sync. Runs both ways each time the PSP is plugged in; overwritten saves are backed up.
[saves]
auto_sync = true          # sync on plug-in when nothing conflicts; conflicts always wait for you
# The PSP's games, linked (not copied) into this folder of PPSSPP's memory stick while the PSP is plugged in, so PPSSPP
# plays them straight off the PSP. Labels from [device.folders]; [] turns it off.
game_links = ["isos", "games"]
games_folder = "PSP_STICK"

# PPSSPP's memory stick PSP folder, per OS; the first that exists is used. {documents} = your Documents folder.
# Portable or custom installs: pick the folder in the app, or add it here.
[saves.ppsspp_paths]
windows = ["{documents}/PPSSPP/PSP"]
linux = ["~/.config/ppsspp/PSP", "~/.var/app/org.ppsspp.PPSSPP/config/ppsspp/PSP"]

# Cloud backup. On plug-in or BACK UP NOW, first syncs the PSP with PPSSPP (see [saves]; saves changed on both sides are
# asked about), then mirrors the folders below to a cloud folder, uploading only changed files. RESTORE
# downloads that folder back to the stick. Nothing is deleted in the cloud. Sign-in happens in your browser; the token
# is kept in the OS keyring.
[backup]
provider = "gdrive"       # gdrive | dropbox | any provider registered under the "pspm.cloud" entry point
auto = true               # back up on plug-in once signed in
folders = ["saves"]       # labels from [device.folders], e.g. ["saves", "music", "photos"]
remote_folder = "PSPM"    # cloud folder, changeable in the app; "Backups/PSP" makes nested folders
redirect_port = 0         # browser sign-in returns to http://127.0.0.1:<port>/; 0 = any free port (Dropbox needs a fixed one)
login_timeout_seconds = 300

# PSPM's own Google OAuth client (type "Desktop app", scope drive.file), so signing in is one button. Google treats a
# desktop app's secret as not confidential. To use your own client instead, set both in your config.toml.
[backup.gdrive]
client_id = "384504129472-1mlrqm589srl7ch32leg2e8r3139vpu5.apps.googleusercontent.com"
client_secret = ""      # set in your config.toml; GitHub refuses Google secrets in a public repo
auth_url = "https://accounts.google.com/o/oauth2/v2/auth"
token_url = "https://oauth2.googleapis.com/token"
api_url = "https://www.googleapis.com/drive/v3"
upload_url = "https://www.googleapis.com/upload/drive/v3"

# Dropbox needs an app of your own (see README); put its key in your config.toml.
[backup.dropbox]
client_id = ""            # the Dropbox app key (PKCE, no secret needed)
redirect_port = 53682     # register http://127.0.0.1:53682/ in your app
auth_url = "https://www.dropbox.com/oauth2/authorize"
token_url = "https://api.dropboxapi.com/oauth2/token"
api_url = "https://api.dropboxapi.com/2"
content_url = "https://content.dropboxapi.com/2"
chunk_mb = 64             # files bigger than this upload in parts (Dropbox caps one request at 150 MB)

# Diagnostics. Battery, firmware and model can't be read over USB: PSPM's PSP app ([cast] app, installed from
# the DIAGNOSTICS or STREAMING page, needs custom firmware) writes them to info_file in its INFO mode.
[diag]
info_file = "PSP/COMMON/pspm_info.txt"
test_folder = "PSPM_TEST"  # capacity test data, removed after VERIFY
test_file_mb = 1024        # size of each test file (FAT32 caps files at 4 GB)
test_reserve_mb = 16       # free space left untouched by the capacity test
speed_test_mb = 64         # size of the TEST SPEED write and read
junk = ["._*", ".DS_Store", "Thumbs.db", "desktop.ini"]  # leftovers from other computers, counted on the stick
plugin_lists = ["SEPLUGINS/PLUGINS.TXT", "SEPLUGINS/GAME.TXT", "SEPLUGINS/VSH.TXT", "SEPLUGINS/POPS.TXT"]
[diag.cfw_folders]         # a folder on the stick -> the custom firmware it belongs to (add others here)
"PSP/SAVEDATA/ARK_01234" = "ARK"

# PS1 converter. Turns PS1 disc images into an EBOOT.PBP in the games folder, for the PSP's PS1 emulator.
# Uses PSXPackager (MIT, github.com/RupertAvery/PSXPackager), downloaded on first use and checked by sha256.
# Its download includes the converter's own base files; PSPM ships none of them. Needs custom firmware on the PSP.
[ps1]
version = "1.6.3"
compression = 5            # 0-9; higher is smaller and slower to convert
timeout_seconds = 120

# Title and artwork found online by game ID (SLUS-00594...). {serial} is the game ID, {name} the Redump name the
# title list gives. GameDB-PSX (github.com/niemasd/GameDB-PSX) has the titles; libretro-thumbnails has the pictures.
# Leave a picture empty ("") to not look it up. No public source has XMB music (SND0.AT3), so that one is picked by hand.
[ps1.online]
timeout_seconds = 20
title = "https://raw.githubusercontent.com/niemasd/GameDB-PSX/main/games/{serial}/title.txt"
name = "https://raw.githubusercontent.com/niemasd/GameDB-PSX/main/games/{serial}/release_name.txt"
icon0 = "https://raw.githubusercontent.com/libretro-thumbnails/Sony_-_PlayStation/master/Named_Boxarts/{name}.png"
pic0 = "https://raw.githubusercontent.com/libretro-thumbnails/Sony_-_PlayStation/master/Named_Titles/{name}.png"
pic1 = "https://raw.githubusercontent.com/libretro-thumbnails/Sony_-_PlayStation/master/Named_Snaps/{name}.png"

[ps1.tool.windows]          # needs the .NET 8 runtime (Windows offers to install it on first run)
url = "https://github.com/RupertAvery/PSXPackager/releases/download/v1.6.3/psxpackager-win-x64.zip"
sha256 = "3aaabe6009461c13bec85cfc441cf30dac6314867297a0bfd9b4b0257c8ced83"
exe = "psxpackager.exe"

[ps1.tool.linux]
url = "https://github.com/RupertAvery/PSXPackager/releases/download/v1.6.3/psxpackager-linux-x64.tar.gz"
sha256 = "378ecb4d2310c8f72fc77ec092e50797427de79d6e001ab0b56eaad4699890da"
exe = "psxpackager-linux-x64/psxpackager"

# Screen streaming, PSP to PC, with RemoteJoyLite (github.com/Kethen/RemoteJoyLite): a plugin on the PSP sends the
# screen over the USB cable to a viewer window on the PC, which also passes your keyboard or gamepad to the PSP.
# Downloaded on first use and checked by sha256. Needs custom firmware. PC to PSP is [cast] below.
[stream]
plugin = "SEPLUGINS/RemoteJoyLite.prx"
check_seconds = 5  # START VIEWER waits this long for the viewer to fail before calling it started
# Linux: lets you, not just root, open the PSP's USB (both directions) and PSPM create the virtual gamepad for the
# PSP's controls. Written to /etc/udev/rules.d once, with one password prompt.
udev_rule = """
SUBSYSTEM=="usb", ATTRS{idVendor}=="054c", ATTRS{idProduct}=="01c9", MODE="0660", TAG+="uaccess"
SUBSYSTEM=="block", ATTRS{idVendor}=="054c", ATTRS{idProduct}=="01c9", ATTRS{bcdDevice}=="0300", TAG+="uaccess"
KERNEL=="uinput", SUBSYSTEM=="misc", MODE="0660", TAG+="uaccess", OPTIONS+="static_node=uinput"
"""

# Plugin list on the stick -> lines that load the plugin. PLUGINS.TXT is ARK's; the .txt files are PRO/ME's.
# shortcut: paths say ms0:, so a PSP Go streams only with the plugin on its memory stick, not internal storage (ef0:).
[stream.lists]
"SEPLUGINS/PLUGINS.TXT" = ["vsh, ms0:/SEPLUGINS/RemoteJoyLite.prx, on", "game, ms0:/SEPLUGINS/RemoteJoyLite.prx, on",
                           "pops, ms0:/SEPLUGINS/RemoteJoyLite.prx, on"]
"SEPLUGINS/vsh.txt" = ["ms0:/SEPLUGINS/RemoteJoyLite.prx 1"]
"SEPLUGINS/game.txt" = ["ms0:/SEPLUGINS/RemoteJoyLite.prx 1"]
"SEPLUGINS/pops.txt" = ["ms0:/SEPLUGINS/RemoteJoyLite.prx 1"]

[stream.tool]
version = "2026-01-06"
url = "https://github.com/Kethen/RemoteJoyLite/releases/download/2026-01-06/RemoteJoyLite_a0bc706a.zip"
sha256 = "93c6c739e05a5008e753f5b0982f78130bbc863bae9f3668349919ed8ba68768"
prx = "psp/RemoteJoyLite.prx"
timeout_seconds = 120

# Viewer per OS; {dir} is the unpacked download. Use the _JA_ files for the Japanese viewer. On Linux it runs in Wine.
[stream.run]
windows = ["{dir}/x64/RemoteJoyLite_EN_64.exe"]
linux = ["bash", "{dir}/x64_linux/start_linux_EN.sh"]

# Screen streaming, PC to PSP: PSPM's own PSP app (psp/pspm) shows frames PSPM sends over USB or Wi-Fi.
[cast]
app = "PSPM"          # folder in the games folder, or in the CAT_ folder picked on the page
old_apps = ["PSPM_SCREEN", "PSPM_INFO"]  # the two apps it replaced, removed when it's installed
vendor = 0x054C
product = 0x01C9      # PSPLink's "Type B", so RemoteJoyLite's Windows driver (Zadig) and the udev rule cover it
bcd_device = 0x0200   # tells PSPM's app apart from RemoteJoyLite (0x0100) on the same ID
# CONTROLLER mode over the cable: the PSP app is a read-only USB drive of the memory stick (bcdDevice drive_bcd)
# and the buttons are in the drive_tail sectors after the stick's end, read drive_hz times a second (Linux).
drive_bcd = 0x0300
drive_tail = 8
drive_hz = 120
endpoint = 0x02       # frames to the PSP
pad_endpoint = 0x81   # the PSP's buttons and stick back to the PC
timeout_ms = 2000
# Wi-Fi (picked in the PSP app's menu): PSPM finds the PSP with a UDP broadcast, then streams over TCP.
wifi_port = 4000
find_port = 4001
find_seconds = 3
wifi_host = ""        # the address the PSP shows, when a firewall blocks the search
max_fps = 30
captures = 4          # screen captures in flight at once; more = higher FPS when capturing is slow
quality = 80          # JPEG quality of each frame; the PSP decodes them in hardware
# Wayland (wlroots: Sway, Hyprland...) capture; -s 0.5 halves the size, -o <output> picks one of several screens.
# X11 and Windows use Pillow's ImageGrab.
wayland_capture = ["grim", "-s", "0.5", "-t", "ppm", "-"]
# Sound from the PC, switched on the PSP with its note button: off, on, best. 16-bit stereo at these rates.
audio_rates = [0, 22050, 44100]
audio_block = 4096    # bytes per sound packet (about 23-46 ms)
# Linux: parec records what the default output plays (PulseAudio and PipeWire). Windows uses WASAPI loopback.
audio_capture = ["parec", "--device=@DEFAULT_MONITOR@", "--format=s16le", "--channels=2", "--raw",
                 "--latency-msec=20", "--rate={rate}"]
# PSP controls on the PC, as profiles; SELECT on the PSP steps to the next one. Each button maps to a key (a-z, 0-9,
# space, enter, esc, tab, backspace, shift, ctrl, alt, up, down, left, right, f1-f12), a mouse button
# (mouse_left/right/middle), a gamepad button (pad_a/b/x/y/lb/rb/select/start/up/down/left/right; Linux only for now)
# or "none". The stick: "pad", "mouse", "arrows", "wasd" or "none". The Streaming page edits these, adds profiles
# (up to 6) and keeps them in psp_controls.json next to config.toml.
dead_zone = 24        # stick movement ignored around the middle, of 128
mouse_speed = 12      # pixels per 1/60 s with the stick pushed all the way
# The quality preset picked in the PSP app's menu on the PSP overrides quality, max_fps and captures above.
[cast.presets.best_quality]
quality = 92
max_fps = 20
captures = 4
[cast.presets.balanced]
quality = 80
max_fps = 30
captures = 4
[cast.presets.best_fps]
quality = 55
max_fps = 60
captures = 8
[[cast.profiles]]
name = "DESKTOP"
stick = "mouse"
[cast.profiles.buttons]
l = "mouse_left"
r = "mouse_right"
cross = "enter"
square = "backspace"
triangle = "ctrl"
circle = "shift"
start = "esc"
up = "up"
down = "down"
left = "left"
right = "right"
[[cast.profiles]]
name = "GAMING"
stick = "pad"
[cast.profiles.buttons]
cross = "pad_a"
circle = "pad_b"
square = "pad_x"
triangle = "pad_y"
l = "pad_lb"
r = "pad_rb"
start = "pad_start"
up = "pad_up"
down = "pad_down"
left = "pad_left"
right = "pad_right"

# Softmod: copies the official ARK custom firmware release to the memory stick, downloaded and checked by sha256.
# PSPM never writes the PSP's flash. You install ARK on the PSP by running the copied app; until you also install a
# cIPL there, ARK is gone after a full power-off and you run the app again. The cIPL installer is only copied when
# you tick it in the app, and it is what writes the PSP's flash when you run it there.
# ARK supports every retail PSP (1000, 2000, 3000, Go, Street E1000) on official firmware 6.60 or 6.61.
[softmod]
default = "ark5"             # ark5 | ark4
firmware = ["6.60", "6.61"]  # blocks the copy when the PSP app's INFO report says anything else
min_battery = 75             # %, asked before copying, and blocks when the INFO report last saw less without the charger
timeout_seconds = 120

# ARK-5 through FasterARK (github.com/PSP-Arkfive/FasterARK), lite variant. Upstream re-uses the "latest" tag for
# each release, so a new release changes the file and the sha256 check refuses it until url/sha256 are updated here.
[softmod.ark5]
name = "ARK-5"
version = "5.1.0"
url = "https://github.com/PSP-Arkfive/FasterARK/releases/download/latest/FasterARK_psp_lite.zip"
sha256 = "16d922916beaaa4b20d7c695c1f4d0bdfa3e43f5e273fd2852c1e29d3e4081dd"
run = "FASTERARK"
cipl_run = "CUSTOMIPL"
[softmod.ark5.copy]          # folder in the download -> folder on the stick
"PSP/GAME/FasterARK" = "PSP/GAME/FasterARK"
"PSP/SAVEDATA/ARK_01234" = "PSP/SAVEDATA/ARK_01234"
[softmod.ark5.cipl]          # permanent install, opt-in
"PSP/GAME/CustomIPL" = "PSP/GAME/CustomIPL"

# ARK-5 updater from the same FasterARK release. Run on a PSP already running ARK-4 or ARK-5, it updates ARK in place and
# keeps the settings and plugins in SEPLUGINS (it's the file ARK's own online updater downloads).
[softmod.update]
name = "ARK-5 update"
version = "5.1.0"
url = "https://github.com/PSP-Arkfive/FasterARK/releases/download/latest/ARK_UPDATE.zip"
sha256 = "9ba03e96522cc2758b5f06e89a237de79ec5ac04eb3b37df258872ab1accfda4"
run = "ARK UPDATE"
[softmod.update.copy]
"PSP/GAME/UPDATE" = "PSP/GAME/UPDATE"

# ARK-4 final release (github.com/PSP-Archive/ARK-4, archived 2026-08-02). It can update itself to ARK-5 later.
[softmod.ark4]
name = "ARK-4"
version = "4.20.69-r206"
url = "https://github.com/PSP-Archive/ARK-4/releases/download/v42069r206/ARK4.zip"
sha256 = "d38f3dda6f18b783bdb05a9c1bf6ed46bf4cbd7963a66db4eca9f6b2fd32c483"
run = "ARK LOADER"
cipl_run = "ARK_CIPL"
[softmod.ark4.copy]
"ARK_01234" = "PSP/SAVEDATA/ARK_01234"
"ARK_Loader" = "PSP/GAME/ARK_Loader"
[softmod.ark4.cipl]          # permanent install, opt-in
"PSP/ARK_cIPL" = "PSP/GAME/ARK_cIPL"

# Theme maker. Builds PTF themes (any PSP on firmware 6.20 or later) and CTF themes (custom firmware with the CXMB plugin,
# which PSPM doesn't install). CXMB only loads a CTF marked for the PSP's firmware: 0xDEAD0660 or 0xDEAD0661 for 6.60/6.61.
# A CTF opened as a template keeps its own mark, since its flash0 files only fit the firmware it was made for.
[theme_maker]
ctf_magic = 0xDEAD0661

# PC programs features need, installed from the SETUP page with this PC's package manager (it asks for your password
# or UAC). check per OS: cmd:<program on PATH> | lib:<shared library> | path:<file, glob and %VARS% allowed>.
# packages: per package manager; a tool with none for yours links to url instead. Downloads PSPM fetches itself
# (PSXPackager, RemoteJoyLite, ARK) aren't listed: they need nothing from you.
[deps.managers]             # first one found on PATH is used; {pkg} = install one package per call
pacman = ["pkexec", "pacman", "-S", "--needed", "--noconfirm"]
apt = ["pkexec", "apt-get", "install", "-y"]
dnf = ["pkexec", "dnf", "install", "-y"]
zypper = ["pkexec", "zypper", "--non-interactive", "install"]
winget = ["winget", "install", "--exact", "--silent", "--accept-package-agreements", "--accept-source-agreements",
          "--id", "{pkg}"]

[deps.tools.wine]
name = "Wine"
features = ["stream"]       # runs the Windows streaming viewer
check = { linux = "cmd:wine" }
packages = { pacman = ["wine"], apt = ["wine"], dnf = ["wine"], zypper = ["wine"] }  # Arch: needs [multilib]

[deps.tools.libusb]
name = "libusb 0.1"
features = ["stream"]
check = { linux = "lib:usb-0.1", windows = "path:%SystemRoot%/System32/drivers/libusb0.sys" }
packages = { pacman = ["libusb-compat"], apt = ["libusb-0.1-4"], dnf = ["libusb-compat-0.1"], zypper = ["libusb-0_1-4"] }
url = "https://zadig.akeo.ie"
note = "Windows: with the streaming plugin running on the PSP, open Zadig, pick PSP Type B, install libusb-win32"

[deps.tools.grim]
name = "grim"
features = ["stream"]       # captures the screen on Wayland for PC to PSP
check = { linux = "cmd:grim" }
packages = { pacman = ["grim"], apt = ["grim"], dnf = ["grim"], zypper = ["grim"] }

[deps.tools.parec]
name = "parec"
features = ["stream"]       # records the PC's sound for PC to PSP
check = { linux = "cmd:parec" }
packages = { pacman = ["libpulse"], apt = ["pulseaudio-utils"], dnf = ["pulseaudio-utils"], zypper = ["pulseaudio-utils"] }

[deps.tools.dotnet]
name = ".NET 8 runtime"
features = ["ps1"]
check = { windows = "path:%ProgramFiles%/dotnet/shared/Microsoft.NETCore.App/8.*" }
packages = { winget = ["Microsoft.DotNet.Runtime.8"] }

[deps.tools.icu]
name = "ICU"
features = ["ps1"]          # PSXPackager's Linux build won't start without it
check = { linux = "lib:icuuc" }
packages = { pacman = ["icu"], apt = ["libicu-dev"], dnf = ["libicu"] }

[deps.tools.dosfstools]
name = "dosfstools"
features = ["diag"]         # fsck.vfat, for CHECK FILESYSTEM
check = { linux = "path:/usr/*bin/fsck.vfat" }  # often in sbin, which isn't on a user's PATH
packages = { pacman = ["dosfstools"], apt = ["dosfstools"], dnf = ["dosfstools"], zypper = ["dosfstools"] }

[deps.tools.polkit]
name = "pkexec"
features = ["diag", "stream"]  # the password prompt for the filesystem check and the streaming USB rule
check = { linux = "cmd:pkexec" }
packages = { pacman = ["polkit"], apt = ["pkexec"], dnf = ["polkit"], zypper = ["polkit"] }

[deps.tools.udisks]
name = "udisks2"
features = ["files"]        # mounts the PSP when the desktop doesn't
check = { linux = "cmd:udisksctl" }
packages = { pacman = ["udisks2"], apt = ["udisks2"], dnf = ["udisks2"], zypper = ["udisks2"] }

[themes.dark]
bg = "#000000"
surface = "#111111"
border = "#333333"
text = "#E8E8E8"
text_secondary = "#999999"
text_disabled = "#666666"
display = "#FFFFFF"
accent = "#D71921"
success = "#4A9E5C"

[themes.light]
bg = "#F5F5F5"
surface = "#FFFFFF"
border = "#CCCCCC"
text = "#1A1A1A"
text_secondary = "#666666"
text_disabled = "#999999"
display = "#000000"
accent = "#D71921"
success = "#4A9E5C"
