<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270">
  <!-- PSP-1000 front (silver), traced for PSPM. Same units as SPOTS in psp.py. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e2e2"/>
      <stop offset="0.5" stop-color="#cfcfcf"/>
      <stop offset="1" stop-color="#bdbdbd"/>
    </linearGradient>
    <linearGradient id="lcd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e6e6e"/>
      <stop offset="1" stop-color="#4a4a4a"/>
    </linearGradient>
    <linearGradient id="well" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bdbdbd"/>
      <stop offset="1" stop-color="#e6e6e6"/>
    </linearGradient>
    <radialGradient id="key" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#5c5c5c"/>
      <stop offset="0.6" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="nub" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#8a8a8a"/>
      <stop offset="1" stop-color="#555"/>
    </radialGradient>
  </defs>

  <!-- body, shoulder buttons and the top edge -->
  <path d="M70 7 H530 C555 7 592 50 592 135 C592 220 555 263 530 263 H70 C45 263 8 220 8 135 C8 50 45 7 70 7 Z" fill="url(#body)"/>
  <g fill="#f4f4f4" stroke="#555" stroke-width="1.2" stroke-linejoin="round">
    <path d="M106 7 H70 C56.2 7 38.9 20 26 45.9 L38 52 Q66 26 102 26 Z"/>
    <path d="M494 7 H530 C543.8 7 561.1 20 574 45.9 L562 52 Q534 26 498 26 Z"/>
    <path d="M104 244 L98 263 H70 C60 263 52 258 46 252 L52 244 Z"/>
  </g>
  <g stroke="#b0b0b0" stroke-width="1">
    <path d="M108 12 H492 M106 18 H494"/>
  </g>
  <path d="M70 7 H530 C555 7 592 50 592 135 C592 220 555 263 530 263 H70 C45 263 8 220 8 135 C8 50 45 7 70 7 Z" fill="none" stroke="#4a4a4a" stroke-width="2"/>
  <path d="M70 7 H530 C555 7 592 50 592 135 C592 220 555 263 530 263 H70 C45 263 8 220 8 135 C8 50 45 7 70 7 Z" fill="none" stroke="#fff" stroke-width="1" transform="translate(300 135) scale(0.985) translate(-300 -135)"/>

  <!-- screen -->
  <rect x="134" y="27" width="334" height="196" rx="2" fill="#2a2a2a"/>
  <rect x="137" y="30" width="328" height="190" fill="url(#lcd)"/>

  <!-- PlayStation logo, SONY -->
  <g fill="#222">
    <path d="M47 38 L51 39.5 V55 L47 53.5 Z M51 39.5 C61 41 61 50 54 49 V46 C56.5 46 56.5 42.5 51 42 Z"/>
    <path d="M47 50 V52 L42 53.5 L47 54 V55.5 C42 55.5 37 54.5 38 53 C39 51.5 44 50.5 47 50 Z"/>
    <path d="M51 51.5 L59 49 C62 49.5 62 51.5 59.5 52.5 L51 55.5 V53.5 L57 51.4 L51 52.8 Z"/>
  </g>  <text x="510" y="47" text-anchor="middle" font-family="Times New Roman, serif" font-size="13" font-weight="bold" fill="#f6f6f6" stroke="#8a8a8a" stroke-width="0.6" letter-spacing="1">SONY</text>

  <!-- d-pad -->
  <circle cx="74" cy="123" r="46" fill="url(#well)" stroke="#444" stroke-width="1.5"/>
  <g fill="url(#key)" stroke="#000" stroke-width="0.6">
    <path d="M60 81 h28 v18 l-14 12 l-14 -12 Z" />
    <path d="M60 165 h28 v-18 l-14 -12 l-14 12 Z"/>
    <path d="M32 109 v28 h18 l12 -14 l-12 -14 Z"/>
    <path d="M116 109 v28 h-18 l-12 -14 l12 -14 Z"/>
  </g>
  <g fill="#fff">
    <path d="M74 89 l5 6 h-10 Z"/>
    <path d="M74 157 l5 -6 h-10 Z"/>
    <path d="M40 123 l6 -5 v10 Z"/>
    <path d="M108 123 l-6 -5 v10 Z"/>
  </g>

  <!-- analog stick -->
  <circle cx="74" cy="203" r="19" fill="url(#nub)" stroke="#333" stroke-width="1.5"/>

  <!-- status lights, power and hold -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="6">
    <circle cx="23" cy="186" r="1.6" fill="#e0b000"/>
    <rect x="30" y="183" width="10" height="6" rx="1" fill="none" stroke="#777"/>
    <circle cx="27" cy="213" r="1.6" fill="#2fb7b0"/>
    <path d="M34 216 l4 -7 l4 4 l3 -3 v6 Z" fill="#888"/>
    <text x="548" y="188" fill="#2fb7b0">POWER</text>
    <circle cx="577" cy="186" r="1.6" fill="#2fb7b0"/>
    <text x="548" y="215" fill="#888">HOLD</text>
    <circle cx="570" cy="213" r="1.6" fill="#e0b000"/>
  </g>

  <!-- face buttons -->
  <rect x="495" y="89" width="68" height="68" rx="16" transform="rotate(45 529 123)" fill="url(#well)" stroke="#444" stroke-width="1.5"/>
  <g fill="url(#key)" stroke="#000" stroke-width="0.6">
    <circle cx="529" cy="90" r="15"/>
    <circle cx="529" cy="156" r="15"/>
    <circle cx="496" cy="123" r="15"/>
    <circle cx="562" cy="123" r="15"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round">
    <path d="M529 83 l6 11 h-12 Z"/>
    <path d="M524 151 l10 10 M534 151 l-10 10"/>
    <rect x="491" y="117" width="10" height="12"/>
    <circle cx="562" cy="123" r="6"/>
  </g>

  <!-- bottom row: home, volume, PSP, display, sound, select, start -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="6" text-anchor="middle">
    <text x="136" y="250" fill="#888">HOME</text>
    <g fill="url(#key)" stroke="#000" stroke-width="0.6">
      <rect x="170" y="240" width="20" height="13" rx="6.5"/>
      <rect x="208" y="240" width="20" height="13" rx="6.5"/>
      <circle cx="365" cy="247" r="6.5"/>
      <circle cx="391" cy="247" r="6.5"/>
      <path d="M412 239 H444 V244 Q444 255 428 255 Q412 255 412 244 Z"/>
      <path d="M450 239 H482 V244 Q482 255 466 255 Q450 255 450 244 Z"/>
    </g>
    <g stroke="#fff" stroke-width="1.4" fill="none">
      <path d="M176 246.5 h8"/>
      <path d="M214 246.5 h8 M218 242.5 v8"/>
      <rect x="361" y="244" width="8" height="6" rx="1"/>
      <path d="M392 243 v7 M392 243 l2 1.5 M392 250 a1.5 1.5 0 1 1 -1 -1"/>
    </g>
    <text x="428" y="248" fill="#fff" font-size="5">SELECT</text>
    <text x="466" y="248" fill="#fff" font-size="5">START</text>
  </g>
  <!-- PSP logo -->
  <g fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="miter">
    <path d="M266 254 V242 H288 V248 H270"/>
    <path d="M316 242 H294 V248 H314 V254 H292"/>
    <path d="M320 254 V242 H342 V248 H324"/>
  </g>
  <g fill="none" stroke="#999" stroke-width="0.6">
    <path d="M266 254 V242 H288 V248 H270"/>
    <path d="M316 242 H294 V248 H314 V254 H292"/>
    <path d="M320 254 V242 H342 V248 H324"/>
  </g>
</svg>
