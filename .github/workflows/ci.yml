name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]  # add macos-latest when platform/macos.py exists
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  psp-app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: ghcr.io/pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C psp/pspm_info
      # The app ships prebuilt in src/pspm/psp_app so source installs have it; flag a stale copy.
      - run: cmp psp/pspm_info/EBOOT.PBP src/pspm/psp_app/EBOOT.PBP || echo "::warning::src/pspm/psp_app/EBOOT.PBP differs from a fresh build; copy it over if main.c changed"
      - run: make -C psp/pspm_screen
      - run: |
          cmp psp/pspm_screen/EBOOT.PBP src/pspm/psp_app/screen/EBOOT.PBP && cmp psp/pspm_screen/driver/pspm_usb.prx src/pspm/psp_app/screen/pspm_usb.prx || echo "::warning::src/pspm/psp_app/screen differs from a fresh build of psp/pspm_screen; copy it over if the C files changed"
      - uses: actions/upload-artifact@v4
        with:
          name: pspm-info-eboot
          path: psp/pspm_info/EBOOT.PBP
      - uses: actions/upload-artifact@v4
        with:
          name: pspm-screen
          path: |
            psp/pspm_screen/EBOOT.PBP
            psp/pspm_screen/driver/pspm_usb.prx

  build:
    needs: [test, psp-app]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ".[dev]"
      - run: pyinstaller --noconfirm --windowed --name pspm --collect-data pspm --collect-submodules pspm src/pspm/__main__.py
      - uses: actions/upload-artifact@v4
        with:
          name: pspm-${{ runner.os }}
          path: dist/pspm
